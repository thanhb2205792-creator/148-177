<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ôn Thi Sát Hạch CNTT - Phần 6 (Câu 148-177)</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            color: #333;
            line-height: 1.6;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        h1 {
            text-align: center;
            color: #0d6efd;
            margin-bottom: 30px;
            text-transform: uppercase;
            font-size: 22px;
        }
        .question-block {
            background: #fafafa;
            padding: 20px;
            margin-bottom: 25px;
            border-left: 4px solid #0d6efd;
            border-radius: 4px;
            transition: all 0.3s ease;
        }
        .question-text {
            font-weight: 600;
            margin-bottom: 15px;
            font-size: 16px;
        }
        .options {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .option-label {
            display: flex;
            align-items: center;
            padding: 10px 15px;
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .option-label:hover {
            background: #f1f7ff;
            border-color: #0d6efd;
        }
        .option-label input {
            margin-right: 12px;
            transform: scale(1.2);
        }
        .action-buttons {
            display: flex;
            gap: 15px;
            margin-top: 20px;
        }
        .btn {
            flex: 1;
            padding: 15px;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            text-transform: uppercase;
        }
        .btn-submit { background: #0d6efd; }
        .btn-submit:hover { background: #0b5ed7; }
        
        .btn-retry-failed { 
            background: #dc3545; 
            display: none; 
        }
        .btn-retry-failed:hover { background: #bb2d3b; }

        .result-box {
            display: none;
            margin-top: 20px;
            padding: 20px;
            background: #e2e3e5;
            border: 2px solid #6c757d;
            border-radius: 6px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            color: #383d41;
        }
        .correct-answer {
            background: #d1e7dd !important;
            border-color: #198754 !important;
            font-weight: bold;
            color: #0f5132;
        }
        .wrong-answer {
            background: #f8d7da !important;
            border-color: #dc3545 !important;
            color: #842029;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>BỘ CÂU HỎI ÔN THI SÁT HẠCH CNTT (CÂU 148 - 177)</h1>
    <div id="quiz"></div>
    
    <div id="result" class="result-box"></div>

    <div class="action-buttons">
        <button class="btn btn-submit" id="submit-btn" onclick="checkAnswers()">Nộp bài & Xem kết quả</button>
        <button class="btn btn-retry-failed" id="retry-btn" onclick="filterWrongQuestions()">Làm lại các câu sai</button>
    </div>
</div>

        correct: 3

        correct: 3

        a: ["Định dạng trang", "Lưu tập tin văn bản vào đĩa", "Tạo tập tin văn bản mới", "Chức năng tìm kiếm trong soạn thảo"],
        correct: 3
    },
    {
        q: "Phương thức phân phối phần mềm nào là miễn phí và có sẵn cho bản thử nghiệm nhưng cần phải trả phí cho ai đó khi mà sử dụng nó lâu dài?",
        a: ["Nâng cấp", "Miễn phí", "Nguồn mở", "Chia sẻ (Miễn phí dùng thử, trả tiền khi dùng lâu dài)"],
        correct: 3
    },
    {

        a: ["1Angiang6", "1Angiang2", "5Angiang6", "5Angiang2"],
        correct: 0

    {

        a: ["4", "5", "3", "2"],

let shuffledQuizData = [];
let wrongQuestionIndexes = [];

function prepareQuizData() {
    shuffledQuizData = quizData.map((item) => {
        let optionsWithMeta = item.a.map((optionText, index) => {
            return { text: optionText, isCorrect: index === item.correct };
        });

        for (let i = optionsWithMeta.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [optionsWithMeta[i], optionsWithMeta[j]] = [optionsWithMeta[j], optionsWithMeta[i]];
        }

        let newCorrectIndex = optionsWithMeta.findIndex(opt => opt.isCorrect);

        return {
            q: item.q,
            a: optionsWithMeta.map(opt => opt.text),
            correct: newCorrectIndex
        };
    });
}

function loadQuiz() {
    const quizContainer = document.getElementById('quiz');
    let output = '';

    shuffledQuizData.forEach((item, qIndex) => {
        const questionNumber = qIndex + 148; 
        output += `
            <div class="question-block" id="q-block-${qIndex}">
                <div class="question-text">Câu ${questionNumber}: ${item.q}</div>
                <div class="options">
        `;
        
        item.a.forEach((option, oIndex) => {
            const prefix = String.fromCharCode(97 + oIndex); 
            output += `
                <label class="option-label" id="label-${qIndex}-${oIndex}">
                    <input type="radio" name="question${qIndex}" value="${oIndex}">
                    ${prefix}. ${option}
                </label>
            `;
        });

        output += `
                </div>
            </div>
        `;
    });

    quizContainer.innerHTML = output;
}

function checkAnswers() {
    let score = 0;
    wrongQuestionIndexes = []; 

    shuffledQuizData.forEach((item, qIndex) => {
        const block = document.getElementById(`q-block-${qIndex}`);
        if (block.style.display === 'none') return; 

        const selected = document.querySelector(`input[name="question${qIndex}"]:checked`);
        
        item.a.forEach((_, oIndex) => {
            document.getElementById(`label-${qIndex}-${oIndex}`).classList.remove('correct-answer', 'wrong-answer');
        });

        document.getElementById(`label-${qIndex}-${item.correct}`).classList.add('correct-answer');

        if (selected) {
            const answerIndex = parseInt(selected.value);
            if (answerIndex === item.correct) {
                score++;
            } else {
                document.getElementById(`label-${qIndex}-${answerIndex}`).classList.add('wrong-answer');
                wrongQuestionIndexes.push(qIndex);
            }
        } else {
            wrongQuestionIndexes.push(qIndex);
        }
    });

    const totalQuestionsInTurn = shuffledQuizData.length - (shuffledQuizData.length - document.querySelectorAll('.question-block:not([style*="display: none"])').length);
    const resultBox = document.getElementById('result');
    resultBox.style.display = 'block';
    resultBox.innerHTML = `Kết quả lượt này: Đúng ${score}/${totalQuestionsInTurn} câu!`;

    const retryBtn = document.getElementById('retry-btn');
    if (wrongQuestionIndexes.length > 0) {
        retryBtn.style.display = 'block';
    } else {
        retryBtn.style.display = 'none';
        resultBox.innerHTML += " 🎉 Tuyệt vời! Bạn đã hoàn thành chính xác tất cả các câu hỏi!";
    }
    
    resultBox.scrollIntoView({ behavior: 'smooth' });
}

function filterWrongQuestions() {
    shuffledQuizData.forEach((item, qIndex) => {
        const block = document.getElementById(`q-block-${qIndex}`);
        
        if (wrongQuestionIndexes.includes(qIndex)) {
            block.style.display = 'block';

            let currentOptions = item.a.map((text, idx) => {
                return { text: text, isCorrect: idx === item.correct };
            });
            for (let i = currentOptions.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [currentOptions[i], currentOptions[j]] = [currentOptions[j], currentOptions[i]];
            }
            item.a = currentOptions.map(o => o.text);
            item.correct = currentOptions.findIndex(o => o.isCorrect);

            const optionsContainer = block.querySelector('.options');
            let optionsHTML = '';
            item.a.forEach((option, oIndex) => {
                const prefix = String.fromCharCode(97 + oIndex);
                optionsHTML += `
                    <label class="option-label" id="label-${qIndex}-${oIndex}">
                        <input type="radio" name="question${qIndex}" value="${oIndex}">
                        ${prefix}. ${option}
                    </label>
                `;
            });
            optionsContainer.innerHTML = optionsHTML;

        } else {
            block.style.display = 'none';
        }
    });

    document.getElementById('result').style.display = 'none';
    document.getElementById('retry-btn').style.display = 'none';
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

prepareQuizData();
loadQuiz();
</script>

</body>
